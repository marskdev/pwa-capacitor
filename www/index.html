<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5fff">
  <title>PWA + Capacitor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    h1 { margin: 0 0 8px; }
    #count { font-size: 3rem; font-weight: 700; }
    button {
      font-size: 1.1rem;
      padding: 12px 28px;
      border: 0;
      border-radius: 8px;
      background: #0b5fff;
      color: #fff;
    }
    p { margin: 0; }
    .muted { opacity: 0.7; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>PWA + Capacitor</h1>
  <div id="count">0</div>
  <button id="inc" type="button">Increment</button>
  <p id="platform">platform: web</p>
  <p id="net">status: online</p>
  <p class="muted" id="build">build: dev</p>

  <script>
    (function () {
      var KEY = 'counter';
      var countEl = document.getElementById('count');
      var count = 0;
      try { count = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
      countEl.textContent = count;

      document.getElementById('inc').addEventListener('click', function () {
        count += 1;
        countEl.textContent = count;
        try { localStorage.setItem(KEY, String(count)); } catch (e) {}
      });

      var platform = window.Capacitor && Capacitor.getPlatform ? Capacitor.getPlatform() : 'web';
      document.getElementById('platform').textContent = 'platform: ' + platform;

      var netEl = document.getElementById('net');
      function updateNet() {
        netEl.textContent = 'status: ' + (navigator.onLine ? 'online' : 'offline');
      }
      window.addEventListener('online', updateNet);
      window.addEventListener('offline', updateNet);
      updateNet();

      var isHttp = location.protocol === 'http:' || location.protocol === 'https:';
      if (isHttp && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.error('Service worker registration failed', err);
        });
      }
    })();
  </script>
</body>
</html>
